<div class="page-container">
        <div class="page-header">
          <div>
            <h1 class="page-title">Brand Management</h1>
            <p class="page-subtitle">Manage brands, their details and status</p>
          </div>

          <button class="btn btn-primary" (click)="showAddBrandModal = true">+ Add Brand</button>
        </div>

        <!-- Filter Bar -->
        <div class="card filter-card">
          <div class="filter-inputs">
            <div class="search-input-wrapper">
              <span>🔍</span>
              <input type="text" placeholder="Search by brand name..." [(ngModel)]="searchQuery" />
            </div>

            <select class="form-control select-filter">
              <option>All Status</option>
              <option>Active</option>
              <option>Inactive</option>
            </select>

            <select class="form-control select-filter">
              <option>All Categories</option>
              <option>Electronics</option>
              <option>Fashion</option>
            </select>
          </div>
        </div>

        <!-- Brands Table Card -->
        <div class="card table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>Brand</th>
                <th>Category</th>
                <th>Status</th>
                <th>Featured</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let b of filteredBrands; let i = index">
                <td>
                  <div class="brand-cell">
                    <img [src]="b.logo" [alt]="b.name" class="brand-logo-img" />
                    <span class="brand-name-txt">{{b.name}}</span>
                  </div>
                </td>
                <td>{{b.category}}</td>
                <td><span class="badge badge-success">{{b.status}}</span></td>
                <td>
                  <label class="switch">
                    <input type="checkbox" [checked]="b.featured" (change)="toggleFeatured(b)" />
                    <span class="slider round"></span>
                  </label>
                </td>
                <td>
                  <div class="action-btns">
                    <button class="icon-action-btn" title="Edit">✏️</button>
                    <button class="icon-action-btn delete" (click)="deleteBrand(i)" title="Delete">🗑️</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>

          <div class="table-footer">
            <span class="table-info">Showing 1 - {{filteredBrands.length}} of {{brands.length}} brands</span>
            <div class="pagination">
              <button class="page-btn">‹</button>
              <button class="page-btn active">1</button>
              <button class="page-btn">›</button>
            </div>
      </div>

<!-- Modal -->
<div class="modal-backdrop" *ngIf="showAddBrandModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Add New Brand</h3>
      <button class="modal-close" (click)="showAddBrandModal = false">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Brand Name</label>
        <input type="text" class="form-control" placeholder="e.g. Puma" [(ngModel)]="newBrandName" />
      </div>
      <div class="form-group mt-3">
        <label class="form-label">Category</label>
        <select class="form-control" [(ngModel)]="newCategory">
          <option>Electronics</option>
          <option>Fashion</option>
          <option>Home & Living</option>
          <option>Beauty</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="showAddBrandModal = false">Cancel</button>
      <button class="btn btn-primary" (click)="addBrand()">Save Brand</button>
    </div>
  </div>
</div>
