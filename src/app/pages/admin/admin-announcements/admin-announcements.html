<div class="page-container">
        <div class="page-header">
          <div>
            <h1 class="page-title">Announcements</h1>
            <p class="page-subtitle">Create and manage platform announcements</p>
          </div>

          <button class="btn btn-primary" (click)="showAddModal = true">+ New Announcement</button>
        </div>

        <!-- Table Card -->
        <div class="card table-card">
          <table class="data-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Type</th>
                <th>Priority</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let a of announcements; let i = index">
                <td class="font-semibold">{{a.title}}</td>
                <td>{{a.type}}</td>
                <td>
                  <span class="badge" [ngClass]="{
                    'badge-high': a.priority === 'High',
                    'badge-medium': a.priority === 'Medium',
                    'badge-low': a.priority === 'Low'
                  }">{{a.priority}}</span>
                </td>
                <td>{{a.startDate}}</td>
                <td>{{a.endDate}}</td>
                <td>
                  <span class="badge" [ngClass]="{
                    'badge-success': a.status === 'Active',
                    'badge-info': a.status === 'Scheduled',
                    'badge-gray': a.status === 'Expired'
                  }">{{a.status}}</span>
                </td>
                <td>
                  <div class="action-btns">
                    <button class="icon-action-btn" title="Edit">✏️</button>
                    <button class="icon-action-btn delete" (click)="deleteAnnouncement(i)" title="Delete">🗑️</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
      </div>

<!-- Modal -->
<div class="modal-backdrop" *ngIf="showAddModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Create New Announcement</h3>
      <button class="modal-close" (click)="showAddModal = false">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Title</label>
        <input type="text" class="form-control" placeholder="e.g. Weekend Special Deals" [(ngModel)]="newTitle" />
      </div>
      <div class="form-group mt-3">
        <label class="form-label">Type</label>
        <select class="form-control" [(ngModel)]="newType">
          <option>Promotion</option>
          <option>Maintenance</option>
          <option>General</option>
        </select>
      </div>
      <div class="form-group mt-3">
        <label class="form-label">Priority</label>
        <select class="form-control" [(ngModel)]="newPriority">
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="showAddModal = false">Cancel</button>
      <button class="btn btn-primary" (click)="addAnnouncement()">Save Announcement</button>
    </div>
  </div>
</div>
