<div class="page-container">
        <div class="page-header">
          <div>
            <h1 class="page-title">Deal Analytics</h1>
            <p class="page-subtitle">Track click-through rates, conversions and revenue</p>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card" *ngFor="let s of analyticsStats">
            <div class="stat-title">{{s.title}}</div>
            <div class="stat-value-row">
              <span class="stat-value">{{s.value}}</span>
              <span class="stat-badge positive">{{s.change}}</span>
            </div>
          </div>
        </div>

        <div class="card table-card">
          <div class="card-header">
            <h3>Top Performing Deals</h3>
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th>Deal Title</th>
                <th>Brand</th>
                <th>Clicks</th>
                <th>Conversions</th>
                <th>Revenue Generated</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let d of topDeals">
                <td class="font-semibold">{{d.title}}</td>
                <td>{{d.brand}}</td>
                <td class="font-semibold">{{d.clicks}}</td>
                <td class="font-semibold text-green">{{d.conversions}}</td>
                <td class="font-bold text-pink">{{d.revenue}}</td>
              </tr>
            </tbody>
          </table>
      </div>
