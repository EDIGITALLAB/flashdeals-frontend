<!-- Header -->
<header class="top-header">
  <!-- Brand Logo -->
  <a routerLink="/" class="logo-container">
    <div class="logo-circle">
      <span class="material-symbols-outlined logo-bolt">bolt</span>
    </div>
    <span class="logo-text">Flash<span class="logo-highlight">Deals</span></span>
  </a>

  <!-- Desktop search bar -->
  <div class="search-container">
    <span class="material-symbols-outlined search-icon">search</span>
    <input type="text" class="search-input" placeholder="Search for brands, categories or deals...">
  </div>

  <!-- Desktop Navigation Shortcuts -->
  <nav class="desktop-top-nav">
    <a href="#" class="top-nav-link"><span class="material-symbols-outlined nav-link-icon">grid_view</span> <span>Categories</span></a>
    <a href="#" class="top-nav-link"><span class="material-symbols-outlined nav-link-icon">stars</span> <span>Top Brands</span></a>
    <a routerLink="/explore" class="top-nav-link"><span class="material-symbols-outlined nav-link-icon">bolt</span> <span>Deals</span></a>

  </nav>

  <!-- Mobile search icon button (visible only on mobile) -->
  <button class="mobile-search-btn" (click)="toggleMobileSearch(); $event.stopPropagation()">
    <span class="material-symbols-outlined">search</span>
  </button>

  <div class="header-actions">
    <div class="location-picker-container">
      <div class="location-picker" (click)="toggleDropdown($event)">
        <span class="material-symbols-outlined loc-icon">location_on</span>
        <span class="location-name">{{ selectedLocation }}</span>
        <span class="material-symbols-outlined dropdown-icon" [class.rotated]="showDropdown">keyboard_arrow_down</span>
      </div>

      <!-- Dropdown Menu -->
      @if (showDropdown) {
        <div class="location-dropdown shadow-lg border">
          @for (loc of locations; track loc) {
            <div class="location-item" [class.active]="loc === selectedLocation" (click)="selectLocation(loc, $event)">
              <span class="material-symbols-outlined check-icon" [style.visibility]="loc === selectedLocation ? 'visible' : 'hidden'">check</span>
              <span class="item-text">{{ loc }}</span>
            </div>
          }
        </div>
      }
    </div>

    <button class="icon-btn notification-btn" (click)="goToNotifications()" title="Notifications">
      <span class="material-symbols-outlined">notifications</span>
      <span class="badge">3</span>
    </button>

    <button class="icon-btn wishlist-btn" (click)="goToWishlist()" title="Wishlist">
      <span class="material-symbols-outlined">favorite_border</span>
    </button>

    <!-- Theme Switcher Button (Top Right) -->
    <button class="icon-btn theme-toggle-btn" (click)="themeService.togglePanel()" title="Change Theme & Colors">
      <span class="material-symbols-outlined">palette</span>
    </button>

    <div class="user-avatar-btn" title="Profile">
      <span>E</span>
    </div>
  </div>
</header>

<!-- Mobile expandable search bar -->
@if (showMobileSearch) {
  <div class="mobile-search-overlay" (click)="$event.stopPropagation()">
    <div class="mobile-search-bar-container">
      <span class="material-symbols-outlined mobile-search-icon-inner">search</span>
      <input type="text" class="mobile-search-input" placeholder="Search brands, deals..." autofocus>
      <button class="mobile-search-close" (click)="toggleMobileSearch()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
  </div>
}
